name: Endor Labs Scan
on:
  push:
    branches:
      - test_sast_regressions

jobs:
  scan-repo:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check Opengrep BEFORE scan
        run: |
          echo "Checking opengrep before Endor scan..."
          which opengrep || echo "opengrep not found in PATH (before scan)"
          opengrep --version || echo "Unable to get opengrep version (before scan)"

      - name: Endor Labs Scan
        uses: endorlabs/github-action@main
        with:
          namespace: "leonardo-learn"
          scan_summary_output_type: "table"
          pr: "true"
          enable_github_action_token: "true"
          scan_dependencies: "false"
          scan_sast: "true"
          log_level: "debug"
          log_verbose: "true"

      - name: Check Opengrep AFTER scan
        if: always()
        run: |
          echo "Checking opengrep after Endor scan..."
          which opengrep || echo "opengrep not found in PATH (after scan)"
          opengrep --version || echo "Unable to get opengrep version (after scan)"

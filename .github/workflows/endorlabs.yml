name: Endor Labs Dependency and Secrets Scan
on:
  pull_request:
    branches: [ incremental_sast ]
jobs:
  endor-pr-scan:
    permissions:
      security-events: write # Used to upload Sarif artifact to GitHub
      contents: read # Used to check out a private repository
      actions: read # Required for private repositories to upload Sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication with Endor Labs
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      ENDOR_API: https://api.endorlabs.com
      ENDOR_NAMESPACE: leonardo-learn
      ENDOR_PR_ID: ${{ github.event.pull_request.number }}
      ENDOR_SCM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout Repository (shallow, PR head only)
      uses: actions/checkout@v4
      with:
        # Force a shallow checkout to mirror CI pipelines that only fetch the branch under test.
        fetch-depth: 1
        # Ensure we checkout the PR head commit (not the base branch).
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Debug git state (before baseline fetch)
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Repo status ==="
        git status
        echo "=== Current HEAD ==="
        git --no-pager log -1 --pretty=fuller || true
        echo "=== Remotes ==="
        git remote -v
        echo "=== Branches (local + remote) ==="
        git branch -vv || true
        git branch -r || true

    - name: Attempt to fetch baseline branch with time-based shallow window
      shell: bash
      env:
        BASE_BRANCH: incremental_sast
        SHALLOW_DAYS: "30"
      run: |
        set -euo pipefail
        echo "Attempting to fetch baseline branch '${BASE_BRANCH}' with --shallow-since='${SHALLOW_DAYS} days ago'"
        # This is the behavior we want to reproduce: baseline tip is older than the shallow window,
        # so the baseline ref and/or merge-base may not be resolvable locally.
        # We do NOT fail the job here; we want to observe downstream scan behavior.
        git fetch --no-tags --prune --shallow-since="${SHALLOW_DAYS} days ago" origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" || true

        echo "=== Remote baseline ref resolution ==="
        git show-ref --verify --quiet "refs/remotes/origin/${BASE_BRANCH}" && echo "origin/${BASE_BRANCH} exists" || echo "origin/${BASE_BRANCH} missing"

        echo "=== Try merge-base HEAD vs origin/${BASE_BRANCH} ==="
        (git merge-base HEAD "origin/${BASE_BRANCH}" && echo "merge-base succeeded") || echo "merge-base failed (likely missing history)"

        echo "=== Recent log (top 30) ==="
        git --no-pager log --oneline --decorate -n 30 || true

        echo "=== Shallow marker ==="
        test -f .git/shallow && (echo "repo is shallow"; wc -l .git/shallow; head -n 20 .git/shallow) || echo "repo is not shallow"

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'microsoft'
        java-version: '17'
        cache: maven
    - name: Build Package
      run: mvn clean install
    - name: Download endorctl
      run: |
        echo "Downloading latest endorctl"
        curl -sSL "$ENDOR_API/download/latest/endorctl_linux_amd64" -o endorctl
        echo "$(curl -s $ENDOR_API/sha/latest/endorctl_linux_amd64)  endorctl" | sha256sum -c -
        chmod +x ./endorctl
    - name: Run Endor Labs PR scan (incremental)
      id: endor_scan
      run: |
        echo "Running PR incremental scan; base branch expected: incremental_sast"
        ./endorctl scan --sast \
          --quick-scan \
          --pr \
          --pr-incremental \
          --enable-pr-comments \
          --namespace "$ENDOR_NAMESPACE" \
          --enable-github-action-token=true \
          --output-type json \
          --scm-pr-id="$ENDOR_PR_ID" \
          --scm-token="$ENDOR_SCM_TOKEN" \
          --verbose --log-level=debug
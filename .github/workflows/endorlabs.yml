name: Endor Labs Dependency and Secrets Scan
on:
  pull_request:
    branches: [ incremental_sast ]
jobs:
  endor-pr-scan:
    permissions:
      security-events: write # Used to upload Sarif artifact to GitHub
      contents: read # Used to check out a private repository
      actions: read # Required for private repositories to upload Sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication with Endor Labs
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      ENDOR_API: https://api.endorlabs.com
      ENDOR_NAMESPACE: leonardo-learn
      ENDOR_PR_ID: ${{ github.event.pull_request.number }}
      ENDOR_SCM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout Repository (shallow, PR head only)
      uses: actions/checkout@v4
      with:
        # Force a shallow checkout to mirror CI pipelines that only fetch the branch under test.
        fetch-depth: 1
        # Ensure we checkout the PR head commit (not the base branch).
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Setup to trigger ensureRefsAvailable condition (line 274)
      shell: bash
      env:
        BASE_BRANCH: incremental_sast
      run: |
        set -euo pipefail
        echo "=== Strategy: Create branch ref pointing to hash, but don't fetch commit object ==="
        echo "This allows ForBasedBranch to resolve the branch name to a hash"
        echo "But ensureRefsAvailable will fail to verify the hash, triggering line 274"

        # Step 1: Get the hash of the base branch from remote (without fetching the commit)
        echo "Getting base branch hash from remote..."
        BASE_HASH=$(git ls-remote origin "${BASE_BRANCH}" | awk '{print $1}' | head -n1)

        if [ -z "$BASE_HASH" ]; then
          echo "ERROR: Could not get base branch hash from remote"
          exit 1
        fi

        echo "Base branch hash from remote: ${BASE_HASH}"

        # Step 2: Check if commit object already exists locally
        if git cat-file -e "${BASE_HASH}" 2>/dev/null; then
          echo "⚠️  Commit object already exists locally"
          echo "   This means the commit was fetched during checkout"
          echo "   We need to remove it or use a different hash"
          echo "   Checking commit date..."
          COMMIT_DATE=$(git log -1 --format="%ai" "${BASE_HASH}" 2>/dev/null || echo "unknown")
          echo "   Commit date: ${COMMIT_DATE}"
        else
          echo "✓ Commit object NOT in local repo - perfect!"
        fi

        # Step 3: Create the remote ref pointing to this hash (so HashFromRef can resolve it)
        echo "Creating remote ref: refs/remotes/origin/${BASE_BRANCH} -> ${BASE_HASH}"
        git update-ref "refs/remotes/origin/${BASE_BRANCH}" "${BASE_HASH}" || true

        # Step 4: Verify the ref exists
        if git show-ref --verify --quiet "refs/remotes/origin/${BASE_BRANCH}"; then
          echo "✓ Remote ref created successfully"
          VERIFIED_HASH=$(git rev-parse "refs/remotes/origin/${BASE_BRANCH}")
          echo "  Verified hash: ${VERIFIED_HASH}"

          # Step 5: Final check - commit object should NOT exist
          if git cat-file -e "${BASE_HASH}" 2>/dev/null; then
            echo "⚠️  WARNING: Commit object exists - line 274 may not trigger"
            echo "   The commit might have been fetched during checkout"
          else
            echo "✓ Commit object confirmed missing"
            echo "✓ This WILL trigger line 274: 'Base branch not found locally, attempting to fetch from origin with 30-day depth'"
            echo ""
            echo "Flow:"
            echo "  1. ForBasedBranch resolves '${BASE_BRANCH}' -> ${BASE_HASH} ✓"
            echo "  2. ForBaseHead called with hash ${BASE_HASH} ✓"
            echo "  3. ensureRefsAvailable tries: git rev-parse --verify ${BASE_HASH} ✗ (will fail)"
            echo "  4. Logs: 'Base branch not found locally, attempting to fetch from origin with 30-day depth' ✓"
            echo "  5. Tries: git fetch --shallow-since='30 days ago' origin ${BASE_HASH} ✗ (will fail - can't fetch hash)"
          fi
        else
          echo "✗ Failed to create remote ref"
        fi

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'microsoft'
        java-version: '17'
        cache: maven
    - name: Build Package
      run: mvn clean install
    - name: Download endorctl
      run: |
        echo "Downloading latest endorctl"
        curl -sSL "$ENDOR_API/download/latest/endorctl_linux_amd64" -o endorctl
        echo "$(curl -s $ENDOR_API/sha/latest/endorctl_linux_amd64)  endorctl" | sha256sum -c -
        chmod +x ./endorctl
    - name: Run Endor Labs PR scan (incremental)
      id: endor_scan
      run: |
        echo "Running PR incremental scan; base branch expected: incremental_sast"
        echo "This should trigger: 'Base branch not found locally, attempting to fetch from origin with 30-day depth'"
        ./endorctl scan --sast \
          --quick-scan \
          --pr \
          --pr-incremental \
          --enable-pr-comments \
          --namespace "$ENDOR_NAMESPACE" \
          --enable-github-action-token=true \
          --output-type json \
          --scm-pr-id="$ENDOR_PR_ID" \
          --scm-token="$ENDOR_SCM_TOKEN" \
          --verbose --log-level=debug


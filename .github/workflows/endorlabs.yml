name: Endor Labs Dependency and Secrets Scan
on:
  pull_request:
    branches: [ incremental_sast ]
jobs:
  endor-pr-scan:
    permissions:
      security-events: write # Used to upload Sarif artifact to GitHub
      contents: read # Used to check out a private repository
      actions: read # Required for private repositories to upload Sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication with Endor Labs
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      ENDOR_API: https://api.endorlabs.com
      ENDOR_NAMESPACE: leonardo-learn
      ENDOR_PR_ID: ${{ github.event.pull_request.number }}
      ENDOR_SCM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        # Create a shallow clone with depth 1 - only the current commit
        # This ensures the base branch won't be available locally
        fetch-depth: 1

    - name: Setup to trigger ensureRefsAvailable bug
      run: |
        # Fetch the base branch name so ForBasedBranch can resolve it to a hash
        # But use --shallow-since so if the tip is old, the commit won't be fetched
        git fetch --shallow-since="30 days ago" origin incremental_sast:refs/remotes/origin/incremental_sast || true
        
        # Now delete the actual commit objects but keep the ref
        # This simulates the hash being resolved but not available locally
        # Get the hash of the base branch
        BASE_HASH=$(git rev-parse origin/incremental_sast 2>/dev/null || echo "")
        if [ -n "$BASE_HASH" ]; then
        # Remove the commit object (but keep the ref)
        git update-ref -d refs/heads/temp-branch 2>/dev/null || true
        # The hash should now be unresolved when ensureRefsAvailable runs
        fi

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'microsoft'
        java-version: '17'
        cache: maven
    - name: Build Package
      run: mvn clean install
    - name: Download endorctl
      run: |
        echo "Downloading latest endorctl"
        curl -sSL "$ENDOR_API/download/latest/endorctl_linux_amd64" -o endorctl
        echo "$(curl -s $ENDOR_API/sha/latest/endorctl_linux_amd64)  endorctl" | sha256sum -c -
        chmod +x ./endorctl
    - name: Run Endor Labs PR scan (incremental)
      id: endor_scan
      run: |
        ./endorctl scan --sast \
          --quick-scan \
          --pr \
          --pr-incremental \
          --enable-pr-comments \
          --namespace "$ENDOR_NAMESPACE" \
          --enable-github-action-token=true \
          --output-type json \
          --scm-pr-id="$ENDOR_PR_ID" \
          --scm-token="$ENDOR_SCM_TOKEN" \
          --verbose --log-level=debug